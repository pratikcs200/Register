<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <div class="container">
        <div class="registration-card">
            <header>
                <h1>Student Registration</h1>
                <p>Join our academic community today</p>
            </header>
            
            <form id="registrationForm">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                    <div class="input-line"></div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@university.edu" required>
                    <div class="input-line"></div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <div class="input-line"></div>
                </div>

                <div class="input-group">
                    <label for="course">Course (Optional)</label>
                    <div class="select-wrapper">
                        <select id="course" name="course">
                            <option value="" disabled selected>Select a course</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Business Administration">Business Administration</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Arts & Humanities">Arts & Humanities</option>
                            <option value="Other">Other</option>
                        </select>
                        <span class="custom-arrow"></span>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span>Create Account</span>
                    <div class="btn-highlight"></div>
                </button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
